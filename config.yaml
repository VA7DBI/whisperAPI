server:
  host: 0.0.0.0
  port: 8080

api:
  base_path: /
  swagger_host: https://api.openradiomap.com/

whisper:
  model_path: models/ggml-base.bin
  language: en

audio:
  sample_rate: 16000
  max_duration_seconds: 300
  max_file_size_mb: 25

metrics:
  enabled: true
  path: /metrics

cors:
  enabled: true
  allow_all_origins: true  # Development setting; set false in production.
  allowed_origins: []
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - HEAD
    - OPTIONS
  allowed_headers:
    - Origin
    - Content-Type
    - Content-Length
    - Authorization
    - X-API-Key
  expose_headers:
    - Content-Length

auth:
  enabled: false  # Set to true to enable authentication
  tokens:         # List of valid bearer tokens
    - "your-api-token-here"
  redis:
    enabled: true
    host: "redis-01"
    port: 6379
    db: 0
    password: ""
    key_ttl: 3600  # 1 hour
  postgres:
    enabled: true
    host: "pg18-01"
    port: 5432
    user: "postgres"
    password: "secret"
    dbname: "whisperapi"
    table: "api_tokens"
    query: "SELECT EXISTS(SELECT 1 FROM api_tokens WHERE token = $1 AND valid_until > NOW())"
